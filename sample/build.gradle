android {
    compileSdk rootProject.compileSdkVersion
    namespace "com.chuckerteam.chucker.sample"

    defaultConfig {
        minSdk rootProject.minSdkVersion
        targetSdk rootProject.targetSdkVersion
        applicationId "com.chuckerteam.chucker.sample"
        versionName VERSION_NAME
        versionCode VERSION_CODE.toInteger()
    }

    buildFeatures {
        viewBinding true
        buildConfig = false
    }

    buildTypes {
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }

    signingConfigs {
        debug {
            keyAlias 'chucker'
            keyPassword 'android'
            storeFile file('debug.keystore')
            storePassword 'android'
        }
    }

    lintOptions {
        warningsAsErrors true
        abortOnError true
        disable 'AcceptsUserCertificates'
        disable 'GradleDependency'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
        compilerOptions {
            jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11)
        }
    }

    // ✅ Explicitly configure source sets for Wire-generated code
    sourceSets {
        main {
            java.srcDir "build/generated/source/wire/debug"
//            java.srcDir "build/generated/apollo_sources/debug/rickandmortyapi"
        }
    }

    packaging {
        resources {
            excludes += 'META-INF/versions/9/OSGI-INF/MANIFEST.MF'
            // Optional: Exclude other common duplicates
            excludes += 'META-INF/DEPENDENCIES'
            excludes += 'META-INF/LICENSE*'
            excludes += 'META-INF/NOTICE*'
            excludes += 'META-INF/*.kotlin_module'
        }
    }
}

dependencies {
    debugImplementation project(':library')
    releaseImplementation project(':library-no-op')

    implementation libs.kotlin.stdlib
    implementation libs.kotlinx.coroutines.android
    implementation libs.androidx.activity.ktx

    implementation libs.google.material
    implementation libs.androidx.appcompat
    implementation libs.androidx.constraintlayout

    implementation libs.okhttp.logging.interceptor
    implementation libs.retrofit
    implementation libs.retrofit.converter.gson

//    implementation libs.apollo.runtime

    debugImplementation libs.leakcanary.android
}

apply from: rootProject.file('gradle/kotlin-static-analysis.gradle')
