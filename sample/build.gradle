apply plugin: libs.plugins.android.application.get().pluginId
apply plugin: libs.plugins.kotlin.android.get().pluginId
apply plugin: libs.plugins.wire.get().pluginId
//apply plugin: libs.plugins.apollo.get().pluginId

wire {
    kotlin {
        // ✅ Explicitly set output directory compatible with AGP
        out = "build/generated/source/wire"
    }
    // ✅ Specify proto source location if not in default src/main/proto
    sourcePath {
        srcDir "src/main/proto"
    }
}

