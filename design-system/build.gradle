apply plugin: libs.plugins.android.library.get().pluginId
apply plugin: libs.plugins.ksp.get().pluginId
apply plugin: libs.plugins.kotlin.compose.get().pluginId
apply plugin: libs.plugins.kotlin.android.get().pluginId
apply plugin: libs.plugins.kotlin.kapt.get().pluginId

android {
    compileSdk rootProject.compileSdkVersion
    namespace "com.chuckerteam.chucker.design.system"

    compileOptions {
        kotlinOptions.freeCompilerArgs += [
            '-module-name', "com.github.ChuckerTeam.Chucker.library",
            "-Xexplicit-api=strict"
        ]
    }

    defaultConfig {
        minSdk rootProject.minSdkVersion
        consumerProguardFiles 'proguard-rules.pro'
        resValue("string", "chucker_version", "$VERSION_NAME")
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlin {
        jvmToolchain(17)
    }

    buildFeatures {
        viewBinding true
        buildConfig = false
        compose = true
    }

    resourcePrefix 'chucker_ds_'
}

dependencies {
    implementation libs.kotlin.stdlib

    // Compose BOM (version managed by catalog)
    implementation platform(libs.androidx.compose.bom)
    androidTestImplementation platform(libs.androidx.compose.bom)

    // Compose UI (versions managed by BOM)
    implementation libs.androidx.compose.ui
    implementation libs.androidx.compose.ui.graphics
    implementation libs.androidx.compose.ui.tooling.preview
    implementation libs.androidx.compose.material3
    implementation libs.androidx.activity.compose
    debugImplementation libs.androidx.compose.ui.tooling
    debugImplementation libs.androidx.compose.ui.test.manifest
    implementation libs.androidx.lifecycle.runtime.compose
    implementation libs.androidx.compose.runtime.livedata
    implementation libs.androidx.compose.ui.text
    implementation libs.androidx.compose.material.icons.core

    // Material & Layout (versions from catalog)
    implementation libs.google.material
    implementation libs.androidx.constraintlayout
    implementation libs.androidx.palette.ktx
}
