def isNonStable(String version) {
    def stableKeywords = ['RELEASE', 'FINAL', 'GA', 'STABLE'].any { kw ->
        version.toUpperCase().contains(kw)
    }

    def unstableKeywords = ['SNAPSHOT', 'ALPHA', 'BETA', 'RC', 'CR', 'DEV', 'PREVIEW', 'MILESTONE'].any { kw ->
        version.toUpperCase().contains(kw)
    }

    def numericRegex = /^[0-9]+(\.[0-9]+)*(-[0-9]+)?$/

    def preReleaseRegex = /(?i).*-(alpha|a|beta|b|rc|cr|dev|preview|milestone|m)\d*$/

    return unstableKeywords ||
        (!stableKeywords && !(version ==~ numericRegex) && version ==~ preReleaseRegex)
}

versionCatalogUpdate {
    versionSelector {
        !isNonStable(it.candidate.version)
    }
    //   https://github.com/littlerobots/version-catalog-update-plugin
    pin {
        versions = ["androidGradle", "wire"]
    }
}

